[tox]
minversion = 3.9.0
envlist = py312, py313, py314
isolated_build = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
    MPLBACKEND = Agg
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}
